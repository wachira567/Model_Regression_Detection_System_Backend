services:
  db:
    image: postgres:16
    container_name: mrd_db
    environment:
      POSTGRES_USER: eval
      POSTGRES_PASSWORD: eval_password
      POSTGRES_DB: eval_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eval"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: mrd_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app/backend
      - ./prompts:/app/prompts
      - ./golden-dataset:/app/golden-dataset
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../Model_Regression_Detection_System_Frontend
      dockerfile: Dockerfile.dev
    container_name: mrd_frontend
    ports:
      - "5173:5173"
    volumes:
      - ../Model_Regression_Detection_System_Frontend:/app
      - /app/node_modules
    env_file:
      - .env

volumes:
  pgdata:

networks:
  default:
    name: app-network
