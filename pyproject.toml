[project]
name = "model-regression-detection-backend"
version = "0.1.0"
requires-python = ">=3.11"
description = "Model Regression Detection API"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",          # Async PostgreSQL driver
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",        # SQLite fallback for local dev

    # LLM
    "openai>=1.40.0",

    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0",

    # HTTP
    "httpx>=0.27.0",            # Async HTTP client for Slack/GitHub

    # Security
    "python-jose[cryptography]>=3.3.0",  # JWT handling
    "passlib[bcrypt]>=1.7.4",

    # Reporting
    "jinja2>=3.1.0",            # HTML report templates

    # Observability
    "structlog>=24.0.0",        # Structured logging
    "sentry-sdk[fastapi]>=2.0.0",  # Error tracking (optional)

    # Utilities
    "tenacity>=8.3.0",          # Retry logic
    "numpy>=1.26.0",            # Statistical calculations
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",            # TestClient
    "ruff>=0.5.0",              # Linter + formatter
    "mypy>=1.10.0",             # Type checker
    "bandit>=1.7.0",            # Security linter
    "pip-audit>=2.7.0",         # Dependency vulnerability scanner
    "factory-boy>=3.3.0",       # Test factories
    "deepeval>=1.0.0",          # LLM eval framework
]

[tool.setuptools]
packages = ["app"]
