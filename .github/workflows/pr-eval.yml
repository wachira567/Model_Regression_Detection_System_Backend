name: PR Eval Run

on:
  pull_request:
    paths:
      - 'prompts/**'
      - 'golden-dataset/**'
      - 'app/services/**'

jobs:
  run-eval:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install httpx

    - name: Spin up Local Environment
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        API_SECRET_KEY: "test_secret_key_needs_to_be_32_chars_long_for_jwt_validation"
      run: |
        echo "OPENAI_API_KEY=$OPENAI_API_KEY" >> .env
        echo "API_SECRET_KEY=$API_SECRET_KEY" >> .env
        echo "DATABASE_URL=postgresql+asyncpg://eval:eval_password@db:5432/eval_db" >> .env
        docker compose up -d db backend
        
        echo "Waiting for backend to be healthy..."
        for i in {1..30}; do
          if curl -s http://localhost:8000/health | grep -q "ok"; then
            echo "Backend is up!"
            break
          fi
          echo "Waiting..."
          sleep 2
        done

    - name: Run Eval using CLI
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        echo "Starting Eval Run for PR $PR_NUMBER..."
        python scripts/run_eval_cli.py --feature-id email_classifier --api-url http://localhost:8000
